name: One-time NYFed public calendar check
on:
  push:
    branches: [main]
    paths: ['.github/workflows/market-calendar-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read documented public calendar and its published next-month link
        run: |
          mkdir -p evidence
          python3 - <<'PY'
          import urllib.request,urllib.error,hashlib,json,datetime
          urls=['https://www.newyorkfed.org/research/calendars/nationalecon_cal','https://www.newyorkfed.org/research/calendars/i-nov26.html']
          out=[]
          for u in urls:
              try:
                  q=urllib.request.Request(u,headers={'User-Agent':'MarketReports/1.0 (+https://github.com/yydsdefi-cmyk/COMEX-Gold-Tracker)'})
                  with urllib.request.urlopen(q,timeout=25) as r:
                      b=r.read(1024*1024)
                      out.append({'url':u,'status':r.status,'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest(),'eastern_time_label':b'all Eastern Time' in b,'eci':b'Employment Cost Index' in b,'fetched_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()})
              except Exception as e:out.append({'url':u,'error':type(e).__name__+': '+str(e)})
          print(json.dumps(out,indent=2))
          open('evidence/nyfed-calendar.json','w').write(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nyfed-public-calendar-check
          path: evidence
          retention-days: 1

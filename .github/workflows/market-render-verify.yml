name: One-time expanded mobile report validation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/market-render-verify.yml']
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install one-time official browser test package
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Verify expanded weekly tables and calendar on hosted Pages
        run: |
          mkdir -p evidence
          node <<'JS'
          const fs=require('fs');const {chromium}=require('playwright');
          (async()=>{
            const b=await chromium.launch({headless:true}),results=[];
            for(const width of [360,390]){
              const p=await b.newPage({viewport:{width,height:844}});
              const r=await p.goto('https://yydsdefi-cmyk.github.io/COMEX-Gold-Tracker/market/weekly.html',{waitUntil:'networkidle',timeout:45000});
              if(r.status()!==200)throw Error('HTTP '+r.status());
              await p.getByText('一周市场变化',{exact:true}).click();
              await p.getByText('下周已知事件与风险',{exact:true}).click();
              const section=p.locator('details').filter({has:p.locator('summary').getByText('一周市场变化',{exact:true})});
              const rows=await section.locator('table tr').count();
              const layout=await p.evaluate(()=>({viewport:innerWidth,body:document.body.scrollWidth,eci:document.body.textContent.includes('雇佣成本指数'),bp:document.body.textContent.includes('bp')}));
              if(layout.body>width+1||!layout.eci||!layout.bp||rows!==17)throw Error(JSON.stringify({rows,...layout}));
              await section.screenshot({path:'evidence/weekly-table-'+width+'.png'});
              await p.screenshot({path:'evidence/expanded-weekly-'+width+'.png',fullPage:true});
              results.push({width,rows,status:r.status(),...layout});
              await p.close();
            }
            fs.writeFileSync('evidence/expanded-mobile.json',JSON.stringify({source:'Actual hosted Pages, expanded weekly table and future calendar',status:'PASS',checks:results},null,2));
            console.log(JSON.stringify(results));await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: expanded-mobile-validation
          path: evidence
          retention-days: 1
